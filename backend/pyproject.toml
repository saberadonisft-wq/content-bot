[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "content-bot-backend"
version = "0.1.0"
description = "Local-first game social-listening backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.0",
  "pymongo==4.17.0",
  "httpx==0.28.1",
  "cryptography==46.0.5",
  "PyJWT[crypto]==2.13.0",
  "pydantic-settings==2.14.2",
  "imageio-ffmpeg==0.6.0",
  "yt-dlp[default]==2026.8.19",
  "python-multipart==0.0.32",
  "numpy==2.3.5; python_version < '3.12'",
  "numpy==2.5.1; python_version >= '3.12'",
  "onnxruntime==1.28.0",
]

[project.optional-dependencies]
alignment = ["faster-whisper==1.2.1"]
browser = ["playwright==1.61.0"]
dev = ["pytest==8.4.2", "pytest-asyncio==0.26.0", "ruff==0.16.1", "mongomock==4.3.0", "httpx2==2.12.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/silero-vad-v6.2.1/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor"]
pythonpath = ["."]

[tool.ruff]
# Byte-for-byte upstream reference; checksum is verified by the parity script.
extend-exclude = ["app/assets/silero-vad-v6.2.1/reference_utils_vad.py", "build/**"]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
