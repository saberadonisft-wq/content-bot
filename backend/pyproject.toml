[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "content-bot-backend"
version = "0.1.0"
description = "Local-first game social-listening backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pymongo>=4.10,<5",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
  "imageio-ffmpeg>=0.5.1,<1",
  "ffmpeg-python>=0.2.0,<1",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
web = ["crawl4ai>=0.9,<1"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1", "mongomock>=4.3,<5"]

[tool.setuptools]
packages = ["app", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor"]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
