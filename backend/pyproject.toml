[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "content-bot-backend"
version = "0.1.0"
description = "Local-first game social-listening backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.0",
  "pymongo==4.17.0",
  "httpx==0.28.1",
  "cryptography==46.0.5",
  "pydantic-settings==2.14.2",
  "imageio-ffmpeg==0.6.0",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
alignment = ["faster-whisper==1.2.1"]
browser = ["playwright==1.61.0"]
dev = ["pytest==8.4.2", "pytest-asyncio==0.26.0", "ruff==0.16.1", "mongomock==4.3.0", "httpx2==2.12.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor"]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
