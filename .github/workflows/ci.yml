name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            node: "22"
          - os: windows-latest
            python: "3.13"
            node: "24"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Verify backend dependencies
        run: python -m pip check

      - name: Ruff
        run: ruff check backend

      - name: Backend tests
        run: python -m pytest -q --junitxml=artifacts/backend-tests.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

      - name: Desktop policy tests
        working-directory: frontend
        run: npm run desktop:test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ matrix.os }}
          path: artifacts/backend-tests.xml
          if-no-files-found: ignore

  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: auth-server/requirements.txt
      - name: Install auth test environment
        run: python -m pip install -r auth-server/requirements.txt pytest==8.4.2
      - name: Auth integration tests
        working-directory: auth-server
        run: python -m pytest -q

  voice-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: runtimes/voiceover/requirements-test.txt
      - name: Install worker test environment
        run: python -m pip install -r runtimes/voiceover/requirements-test.txt
      - name: Worker and notebook tests
        run: python -m pytest -q runtimes/voiceover/tests
